name: Tealet
description: >-
  Tealet is a wholesale tea marketplace that connects independent tea growers and
  family farms directly with retailers and businesses. Buyers browse, trace, and
  order specialty teas sourced from family farms and cooperatives across 8 countries
  and 15 growing regions, with grower profiles, farm videos, subscription ordering,
  and a wholesale request flow that emphasize transparency and direct trade from
  source to cup. Tealet originated in Hawaii and is backed by 500 Startups and Blue
  Startups. The company operates a consumer/B2B web storefront with account sign-up,
  newsletter, and blog; it does not currently publish a public developer API,
  documentation, SDKs, or an MCP server.
